<html lang="hi">

<style>
:root{--hd:#eceef0;--bg:#fff;--bg2:#f9f9f9;--tx:#3f3f54;--tx2:#2b2b3a;--mut:#9b9bb4;--ln:#eceef2;--up:#4caf50;--dn:#df514c;--buy:#4184f3;--sell:#ff5722;--ac:#4184f3;--ic:#8c8ca0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hd:#1c1f26;--bg:#14161b;--bg2:#1a1d23;--tx:#c9ccd8;--tx2:#eceef4;--mut:#7d8196;--ln:#252932;--up:#5cc260;--dn:#f0645f;--ic:#8a8fa3}}
:root[data-theme="dark"]{--hd:#1c1f26;--bg:#14161b;--bg2:#1a1d23;--tx:#c9ccd8;--tx2:#eceef4;--mut:#7d8196;--ln:#252932;--up:#5cc260;--dn:#f0645f;--ic:#8a8fa3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--hd)}
body{margin:0;background:var(--hd);color:var(--tx);font:400 15px/1.3 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.15px;max-width:560px;margin:0 auto;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;letter-spacing:inherit}
svg{display:block}
.ixs{position:relative;display:flex;flex-wrap:wrap;padding:14px 44px 0 16px;row-gap:12px}
.ixs .c{flex:0 0 50%;min-width:0;overflow:hidden;white-space:nowrap;font-size:14px;color:var(--tx)}
.ixs .v{margin-top:7px;font-size:14px}.ixs .v b{font-weight:400;margin-right:5px}.ixs .v span{color:var(--mut)}
.chev{position:absolute;right:8px;top:22px;border:0;background:none;color:var(--tx2);padding:6px}
.chev svg{width:24px;height:24px;transition:transform .15s}.chev.o svg{transform:rotate(180deg)}
.ttl{position:relative;padding:12px 52px 0 16px;font-size:26px;font-weight:600;line-height:36px;color:var(--tx2);white-space:nowrap}.ttl .chev{top:12px}
.tb{display:flex;overflow-x:auto;align-items:center;padding:10px 0 0;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tb button{flex:none;border:0;background:none;padding:12px 16px 11px;font-weight:600;font-size:16px;color:var(--tx);position:relative;white-space:nowrap}
.tb button.on{color:var(--ac)}
.tb button.on:after{content:"";position:absolute;left:16px;bottom:0;width:24px;height:3px;background:var(--ac);border-radius:2px}
.tb.w button.on:after{width:34px}
.tb.sp{justify-content:space-between;padding-left:4px;padding-right:4px}
.tb.sp button{padding:12px 14px 11px}.tb.sp button.on:after{left:14px}
.tb.cen{justify-content:center;gap:8px}
.tb.cen button{padding:12px 24px 11px}.tb.cen button.on:after{left:24px}
.lay{margin-left:auto;flex:none;width:40px;height:36px;border-radius:18px;background:#d9e4f6;display:flex;align-items:center;justify-content:center;margin-right:16px;border:0}
.lay svg{width:22px;height:22px;stroke:var(--ac);fill:none;stroke-width:1.8}
.card{margin:0 16px;background:var(--bg);border-radius:4px;box-shadow:0 1px 8px rgba(30,30,60,.13);position:relative;z-index:2}
.srch{margin-top:14px;display:flex;align-items:center;gap:12px;padding:0 16px;height:48px}
.srch svg{width:22px;height:22px;stroke:var(--mut);fill:none;stroke-width:2;flex:none}
.srch input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--tx2);min-width:0;letter-spacing:.15px}
.srch input::placeholder{color:var(--mut)}
.srch small{color:var(--mut);font-size:15px}
.srch .sl{stroke:var(--tx2);width:22px}
.wh{background:var(--bg);border-radius:24px 24px 0 0;min-height:calc(100vh - 170px);padding-bottom:150px;position:relative}
.ng{text-align:right;padding:13px 16px;color:var(--ac);font-size:16px;border-top:1px solid var(--ln)}
.w{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 16px 14px;border-bottom:1px solid var(--ln);position:relative;min-height:68px}
.w .s{font-size:16.5px;color:var(--tx2);font-weight:400}
.w .e{font-size:13px;color:var(--mut);margin-top:8px;text-transform:uppercase}
.w .p{text-align:right}.w .p b{font-size:16.5px;font-weight:400}
.w .c{font-size:14px;color:var(--tx);margin-top:8px;white-space:pre}
.acts{display:none;gap:8px;position:absolute;right:14px;top:50%;transform:translateY(-50%);background:var(--bg);padding-left:8px}
.w.sel .acts{display:flex}.w.sel .p{visibility:hidden}
.b{border:0;border-radius:3px;padding:9px 16px;color:#fff;font-weight:500;font-size:14px}
.b.buy{background:var(--buy)}.b.sell{background:var(--sell)}.b.gh{background:none;border:1px solid var(--ln);color:var(--tx)}
.b.ic{background:var(--bg2);color:var(--tx);padding:9px 12px;border:1px solid var(--ln)}
.up{color:var(--up)}.dn{color:var(--dn)}
.tool{display:flex;justify-content:space-between;align-items:center;padding:0 16px;height:42px;border-bottom:1px solid var(--ln);border-top:1px solid var(--ln)}
.tool .g{display:flex;align-items:center;gap:20px}
.tool button{border:0;background:none;color:var(--ac);display:flex;align-items:center;gap:7px;font-size:16px;padding:0}
.tool button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tool .dim{opacity:.4}
.dn2{width:22px;height:22px;border-radius:50%;display:inline-block;background:radial-gradient(circle,var(--bg) 0 38%,transparent 40%),conic-gradient(#0b57d0 0 10%,#38b6ff 10% 40%,#0b57d0 40%)}
.sumc{padding:14px 16px;display:flex;gap:10px;border-bottom:1px solid var(--ln)}
.sumc div{flex:1}.sumc span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}.sumc b{font-size:19px;font-weight:400;color:var(--tx2)}
.it{padding:14px 16px;border-bottom:1px solid var(--ln)}
.it .r1,.it .r2{display:flex;justify-content:space-between;align-items:center}
.it .r2{margin-top:8px;font-size:13px;color:var(--mut)}

.tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:2px;background:var(--bg2);border:1px solid var(--ln);color:var(--mut);margin-left:6px;vertical-align:middle}
.bdg{font-size:11px;padding:2px 6px;border-radius:2px;color:#fff;margin-right:8px}
.bdg.B{background:var(--buy)}.bdg.S{background:var(--sell)}
.st{font-size:11px;color:var(--mut);border:1px solid var(--ln);padding:1px 6px;border-radius:2px}
.st.ok{color:var(--up);border-color:var(--up)}
.empty{padding:0 30px;text-align:center;position:absolute;left:0;right:0;top:calc(50vh - 150px)}
.empty svg{width:196px;height:189px;margin:0 auto}
.empty h3{margin:14px 0 8px;font-size:19px;font-weight:600;color:var(--tx2)}
.empty p{margin:0;color:var(--mut);font-size:16px}
.fab{touch-action:none;position:fixed;left:max(15px,calc(50% - 265px));top:42%;width:46px;height:46px;border-radius:50%;background:var(--bg);box-shadow:0 2px 10px rgba(0,0,0,.2);border:0;display:none;align-items:center;justify-content:center;z-index:7;color:var(--tx2)}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;background:var(--bg);box-shadow:0 -1px 6px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;padding:11px 0 12px;border:0;background:none;color:var(--tx);font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:5px;white-space:nowrap}
nav svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}
nav button.on{color:var(--ac)}
nav button.on svg{stroke-width:2.1}
.ipo{padding:16px 16px 14px;border-bottom:2px solid var(--ln);position:relative}
.ipo .nm{font-size:14px;color:var(--mut)}.ipo .sy{font-size:17px;color:var(--tx2);margin:8px 0 12px}.ipo .sy i{font-style:normal;color:var(--ac);font-size:12px;margin-left:7px}
.ipo .pr{font-size:16px;color:var(--tx2);display:flex;justify-content:space-between}
.ipo .cl{position:absolute;right:16px;top:44px;background:#efeff2;color:var(--tx2);font-size:13px;padding:8px 14px;text-transform:uppercase}
.sub{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 16px;height:48px}
.sub .l button{border:0;background:none;color:var(--ac);padding:0;display:flex}
html{overflow-x:hidden}
.sub .l{display:flex;gap:20px;color:var(--ac)}.sub .l svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.sub .r{display:flex;gap:2px;flex:1 1 auto;min-width:0;justify-content:flex-end;overflow-x:auto}.sub .r::-webkit-scrollbar{display:none}.sub .r button{border:0;background:none;font:inherit;font-size:14.5px;white-space:nowrap;color:var(--tx2);padding:9px 11px;border-radius:3px}
.sub .r button.on{background:#efeff2;color:var(--ac)}
.vu{padding:20px 16px;color:var(--ac);font-size:17px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--ln)}
.nm2{display:flex;justify-content:space-between;align-items:center;padding:22px 16px 6px;font-size:24px;color:var(--tx2)}
.nm2 svg{width:26px;height:26px;stroke:var(--tx2);fill:none;stroke-width:1.6}
.pc{padding:30px 28px 26px;display:flex;justify-content:space-between;align-items:center}
.pc .id{font-size:23px;color:var(--tx2)}.pc .em{font-size:16px;color:var(--mut);margin-top:12px}
.av{width:84px;height:84px;border-radius:50%;background:#e3eefd;color:#6ea0f0;font-size:34px;display:flex;align-items:center;justify-content:center}
.pm{background:var(--bg2);padding:18px 28px;display:flex;align-items:center;gap:30px;font-weight:600;color:var(--tx2);font-size:18px;border-radius:0 0 4px 4px}
.tg{width:34px;height:20px;border-radius:10px;background:#d9d9de;position:relative;border:0;padding:0}
.tg:after{content:"";position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.tg.on{background:var(--ac)}.tg.on:after{left:15px}
.sec{font-weight:600;font-size:17px;color:var(--tx2);padding:10px 20px 12px}
.li{display:flex;justify-content:space-between;align-items:center;padding:0 20px;height:52px;border-top:1px solid var(--ln);font-size:17px;color:var(--tx2)}
.li svg{width:26px;height:26px;stroke:var(--ic);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cs{display:flex;justify-content:space-between;align-items:center;padding-top:34px}.cs .dn2{width:30px;height:30px}
.lk{display:flex;flex-wrap:wrap;gap:6px 26px;padding:10px 12px 0 44px;font-size:17px;color:var(--ac)}.lk.l2{padding-top:14px}.lk span{padding:4px 0;white-space:nowrap}
.ver{padding:34px 20px 40px;font-size:15px;color:var(--mut)}
.fh{display:flex;align-items:center;justify-content:center;position:relative;padding:13px 0 13px;font-size:20px;font-weight:600;color:var(--tx2)}
.fh button{position:absolute;left:8px;border:0;background:none;color:var(--tx2);padding:6px}.fh svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4}
.fc{text-align:center;padding:18px 10px 18px}
.fc .m{color:var(--mut);font-size:13.7px}
.fc .m i{display:inline-block;width:16px;height:16px;border:1.5px solid var(--ac);border-radius:50%;color:var(--ac);font-style:normal;font-size:10px;line-height:13px;margin-left:5px;vertical-align:middle}
.fc .bg{font-size:26px;font-weight:600;color:var(--ac);margin:6px 0 8px}
.fc .vs{color:var(--ac);font-size:16.7px;display:flex;justify-content:center;align-items:center;gap:8px}.fc .dn2{width:16px;height:16px}
.fb{display:flex;gap:16px;padding:17px 16px 0}
.fb button{flex:1;height:52px;border:0;border-radius:4px;color:#fff;font-weight:600;font-size:16.7px;display:flex;align-items:center;justify-content:center;gap:12px}
.fb svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2}
.f2{display:flex;text-align:center;padding:24px 16px 24px;border-bottom:1px solid var(--ln);margin:0 16px}
.f2 div{flex:1}.f2 span{display:block;color:var(--mut);font-size:13.7px;margin-bottom:8px}.f2 b{font-size:20px;font-weight:600;color:var(--tx2)}
.fr{display:flex;justify-content:space-between;align-items:center;padding:0 20px;height:37px;font-size:16.5px;color:var(--tx2)}
.fr.s{background:var(--bg2)}
.gap{height:25px;border-bottom:1px solid var(--ln);margin:0 16px 24px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
.sheet.show{display:flex}
.box{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:6px 6px 0 0;overflow:hidden}
.oh{padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.oh.B{background:var(--buy)}.oh.S{background:var(--sell)}
.oh b{font-size:16px;font-weight:500}.oh small{display:block;opacity:.9;font-size:13px;margin-top:2px}
.sw{width:42px;height:22px;border-radius:11px;background:rgba(255,255,255,.4);position:relative;border:0}

.sw.S:after{left:22px}
.ob{padding:16px}
.rad{display:flex;gap:18px;margin-bottom:14px;color:var(--tx2)}
.rad label{display:flex;align-items:center;gap:6px;font-size:14px}
.rad input{accent-color:var(--sell)}
.f{display:flex;gap:12px;margin-bottom:12px}

.f input{width:100%;padding:10px;margin-top:4px;border:1px solid var(--ln);border-radius:3px;background:var(--bg);color:var(--tx2);font:inherit;font-size:16px}
.f input:disabled{background:var(--bg2);color:var(--mut)}
.of{display:flex;justify-content:space-between;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);background:var(--bg2);font-size:12px;color:var(--mut)}
.of div b{display:block;font-weight:500;color:var(--tx2);font-size:14px}
.of .b{padding:10px 22px}
.err{color:var(--dn);font-size:13px;padding:0 16px 10px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:3px;font-size:13px;display:none;z-index:30;max-width:90%;text-align:center}
.ng{display:flex;justify-content:space-between;align-items:center}
.ms{font-size:13px;color:var(--mut)}.ms.on{color:var(--up)}
.vt{display:flex;border-bottom:1px solid var(--ln);padding:0 8px}

.vt.B button.on{color:var(--buy);border-bottom-color:var(--buy)}.vt.S button.on{color:var(--sell);border-bottom-color:var(--sell)}
.rad small{color:var(--mut);margin-left:4px;font-size:12px}
.f label{min-width:0}
.of{gap:10px}.of .bt{display:flex;gap:8px}
#dt{z-index:18}
.dbox{height:92vh;overflow-y:auto;border-radius:12px 12px 0 0;position:relative}

.tf{display:flex;gap:8px;padding:8px 16px}

.ch{padding:0 8px 8px}.gl{stroke:var(--ln);stroke-width:1}.ax{fill:var(--mut);font-size:9.5px}.lt{fill:#fff;font-size:9.5px;font-weight:500}
.nc{padding:70px 20px;text-align:center;color:var(--mut)}
.sec2{padding:14px 16px 8px;font-weight:600;color:var(--tx2);font-size:15px}

.dp2 tr.tt td{border-top:1px solid var(--ln);color:var(--mut)}
.kvs{padding:8px 16px 100px}

.dbar{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln)}

.qn{margin:0 20px;padding:10px 0;font-size:13px;color:var(--mut);border-bottom:1px solid var(--ln)}

.dp2{font-size:15px;margin-top:6px}.dp2 th{background:none;font-size:15px;padding:14px 8px}.dp2 td.up{color:var(--buy)}.dp2 td{padding:9px 8px}
